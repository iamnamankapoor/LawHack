<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LawHack</title>
<style>
  :root {
    --cour:#f5c518; --ca:#3fb950; --dem:#3b82f6; --def:#8b5cf6; --loi:#6b7280; --mp:#ec4899; --ind:#9ca3af;
    --warn:#f59e0b; --bad:#ef4444;
    --bg:#0c0d10; --surface:#14161b; --raised:#1a1d23; --line:rgba(255,255,255,.07); --line-strong:rgba(255,255,255,.14);
    --text:#ecedef; --muted:#8a8f9c; --faint:#565b66;
    --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
    --col:720px;
  }
  * { box-sizing:border-box; margin:0 }
  html { color-scheme:dark }
  body { min-height:100vh; background:var(--bg); color:var(--text); font:14px/20px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing:antialiased; font-feature-settings:"cv11","ss01" }
  button, input { font:inherit; color:inherit }
  button { cursor:pointer; background:none; border:0; padding:0 }
  ::selection { background:color-mix(in srgb, var(--cour) 30%, transparent) }
  .num { font-variant-numeric:tabular-nums }

  /* Header */
  header { position:sticky; top:0; z-index:10; height:56px; padding:0 24px; display:flex; align-items:center; gap:16px;
           background:color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line) }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; letter-spacing:-.01em }
  .brand i { width:8px; height:8px; border-radius:2px; background:var(--cour); transition:transform .5s var(--spring) }
  .brand:hover i { transform:rotate(45deg) }
  #docbar { margin-left:auto; display:flex; align-items:center; gap:12px; color:var(--muted); font-size:13px; opacity:0; transform:translateY(-4px);
            pointer-events:none; transition:opacity .3s var(--ease), transform .3s var(--ease) }
  #docbar.on { opacity:1; transform:none; pointer-events:auto }
  #docbar b { color:var(--text); font-weight:500 }
  .sep { width:1px; height:16px; background:var(--line-strong) }
  .ghost { height:32px; padding:0 12px; border-radius:8px; border:1px solid var(--line); color:var(--muted); font-size:13px;
           transition:color .15s, border-color .15s, background .15s, transform .15s var(--ease) }
  .ghost:hover { color:var(--text); border-color:var(--line-strong); background:var(--surface) }
  .ghost:active { transform:scale(.97) }

  /* Views */
  main { width:100%; max-width:calc(var(--col) + 48px); margin:0 auto; padding:0 24px }
  .view { display:none }
  .view.active { display:block; animation:enter .45s var(--ease) both }
  @keyframes enter { from { opacity:0; transform:translateY(8px) } }

  /* Upload */
  #upload.active { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:calc(100vh - 56px); padding:48px 0 96px }
  h1 { font-size:32px; line-height:40px; font-weight:600; letter-spacing:-.025em; text-align:center }
  .lede { margin-top:8px; color:var(--muted); font-size:15px; line-height:24px; text-align:center; max-width:440px }
  #drop { position:relative; margin-top:40px; width:100%; max-width:560px; height:200px; border-radius:16px; border:1px dashed var(--line-strong);
          display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; cursor:pointer; outline:none;
          transition:border-color .2s, background .2s, transform .35s var(--spring) }
  #drop:hover, #drop:focus-visible { border-color:rgba(255,255,255,.24); background:rgba(255,255,255,.015) }
  #drop.over { border-style:solid; border-color:var(--cour); background:color-mix(in srgb, var(--cour) 5%, transparent); transform:scale(1.015) }
  #drop.shake { animation:shake .4s var(--ease) }
  @keyframes shake { 20%,60% { transform:translateX(-4px) } 40%,80% { transform:translateX(4px) } }
  .icon { width:40px; height:40px; margin-bottom:12px; border-radius:12px; display:grid; place-items:center; background:var(--surface);
          border:1px solid var(--line); color:var(--muted); transition:transform .35s var(--spring), color .2s, border-color .2s }
  #drop:hover .icon { transform:translateY(-2px); color:var(--text) }
  #drop.over .icon { transform:translateY(-4px) scale(1.06); color:var(--cour); border-color:color-mix(in srgb, var(--cour) 40%, transparent) }
  #drop strong { font-weight:500 }
  #drop span { color:var(--muted); font-size:13px }
  #demo { margin-top:16px; height:32px; padding:0 12px; border-radius:8px; color:var(--muted); font-size:13px; display:inline-flex; align-items:center; gap:6px;
          transition:color .15s, background .15s }
  #demo:hover { color:var(--text); background:var(--surface) }
  #demo svg { transition:transform .25s var(--ease) }
  #demo:hover svg { transform:translateX(3px) }
  #uperr { margin-top:12px; min-height:20px; color:#f87171; font-size:13px }

  /* Reading */
  #reading { padding:48px 0 }
  .status { display:flex; align-items:center; gap:8px; font-weight:500 }
  .pulse { width:8px; height:8px; border-radius:50%; background:var(--cour); animation:pulse 1.4s ease-in-out infinite }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1) } 50% { opacity:.35; transform:scale(.7) } }
  .track { margin:16px 0; height:2px; border-radius:2px; background:var(--line); overflow:hidden }
  .track i { display:block; height:100%; width:0; background:var(--cour); transition:width .2s linear }
  .track.wait i { width:30%; animation:indef 1.2s var(--ease) infinite }
  @keyframes indef { from { transform:translateX(-100%) } to { transform:translateX(340%) } }
  .doc { height:52vh; overflow:hidden; padding:24px; border-radius:16px; background:var(--surface); border:1px solid var(--line);
         font:12px/20px ui-serif, Georgia, "Times New Roman", serif;
         -webkit-mask-image:linear-gradient(transparent, #000 48px, #000 calc(100% - 48px), transparent) }
  .seg { padding:1px 2px; border-radius:3px; color:var(--faint); transition:background .35s var(--ease), color .35s var(--ease) }
  .seg.on { color:var(--text); background:color-mix(in srgb, var(--c) 22%, transparent) }
  .skel { height:10px; margin:10px 0; border-radius:4px; background:linear-gradient(90deg, var(--line) 0, rgba(255,255,255,.12) 50%, var(--line) 100%) 0 0/200% 100%;
          animation:shimmer 1.4s linear infinite }
  @keyframes shimmer { to { background-position:-200% 0 } }
  .counter { color:var(--muted); font-size:12px }

  /* Chat */
  #chat { padding:32px 0 128px }
  .legend { display:flex; flex-wrap:wrap; gap:4px; margin:0 -8px 24px }
  .legend button { height:24px; padding:0 8px; border-radius:6px; font-size:12px; color:var(--muted); display:inline-flex; align-items:center; gap:6px;
                   transition:color .15s, background .15s }
  .legend button:hover { color:var(--text); background:var(--surface) }
  .dot { width:6px; height:6px; border-radius:50%; background:var(--c); flex:none }
  .empty { padding:24px 0 0 }
  .nw { white-space:nowrap }
  .empty p { color:var(--muted); font-size:13px; margin-bottom:12px }
  .chips { display:flex; flex-wrap:wrap; gap:8px }
  .chip { height:32px; padding:0 12px; border-radius:999px; border:1px solid var(--line); color:var(--muted); font-size:13px;
          transition:color .15s, border-color .15s, background .15s, transform .3s var(--spring) }
  .chip:hover { color:var(--text); border-color:var(--line-strong); background:var(--surface); transform:translateY(-1px) }
  .chip:active { transform:scale(.97) }
  .q { margin:32px 0 16px auto; width:fit-content; max-width:80%; padding:10px 14px; border-radius:16px 16px 4px 16px; background:var(--raised);
       border:1px solid var(--line); animation:rise .35s var(--ease) both }
  .a { font-size:15px; line-height:26px; animation:rise .35s var(--ease) both }
  @keyframes rise { from { opacity:0; transform:translateY(8px) } }
  .s { animation:fade .5s var(--ease) both; animation-delay:calc(var(--i) * 90ms) }
  @keyframes fade { from { opacity:0; filter:blur(2px) } }
  .foot { margin-top:8px; color:var(--faint); font-size:12px; line-height:16px; animation:fade .5s var(--ease) both; animation-delay:calc(var(--i) * 90ms) }
  .thinking { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:14px }
  .dots { display:flex; gap:4px }
  .dots i { width:4px; height:4px; border-radius:50%; background:var(--muted); animation:bounce 1s var(--ease) infinite }
  .dots i:nth-child(2) { animation-delay:.12s } .dots i:nth-child(3) { animation-delay:.24s }
  @keyframes bounce { 0%,60%,100% { transform:none; opacity:.4 } 30% { transform:translateY(-4px); opacity:1 } }
  .shim { background:linear-gradient(90deg, var(--muted) 0, var(--text) 50%, var(--muted) 100%) 0 0/200% 100%; -webkit-background-clip:text; background-clip:text;
          color:transparent; animation:shimmer 2s linear infinite }
  .abstain { color:var(--muted) }
  .err { color:#f87171; font-size:14px }

  /* Pills */
  .pill { --c:var(--ind); display:inline-flex; align-items:center; gap:6px; height:20px; padding:0 8px; margin-left:4px; border-radius:999px; vertical-align:2px;
          font:500 11.5px/20px Inter, ui-sans-serif, system-ui, sans-serif; white-space:nowrap; cursor:default; outline:none;
          color:color-mix(in srgb, var(--c) 70%, #fff); background:color-mix(in srgb, var(--c) 14%, transparent);
          transition:background .15s, box-shadow .15s, opacity .25s, transform .2s var(--ease);
          animation:pop .45s var(--spring) both; animation-delay:calc(var(--i) * 90ms + 180ms) }
  @keyframes pop { from { opacity:0; transform:scale(.6) } }
  .pill:hover, .pill:focus-visible { background:color-mix(in srgb, var(--c) 24%, transparent) }
  .pill.warn { box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--warn) 60%, transparent) }
  .pill.unsupported { box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--bad) 60%, transparent) }
  .pill.neutral { --c:#8a8f9c }
  .pill .flag { width:6px; height:6px; border-radius:50%; background:var(--warn) }
  .pill.unsupported .flag { background:var(--bad) }
  #thread.focus .pill:not(.match) { opacity:.25 }
  #thread.focus .pill.match { transform:translateY(-1px) }

  /* Popover */
  #pop { position:fixed; z-index:20; width:360px; padding:12px; border-radius:12px; background:#111317; border:1px solid var(--line-strong);
         box-shadow:0 12px 32px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3); font-size:12.5px; line-height:18px; pointer-events:none;
         opacity:0; transform:translateY(4px) scale(.98); transform-origin:var(--ox, 50%) bottom; transition:opacity .16s var(--ease), transform .2s var(--ease) }
  #pop.on { opacity:1; transform:none }
  #pop.below { transform-origin:var(--ox, 50%) top }
  .ph { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-weight:500 }
  .ph small { margin-left:auto; color:var(--faint); font-size:11px }
  .quote { padding-left:10px; border-left:2px solid var(--c); color:#c9ccd3; font-family:ui-serif, Georgia, serif; font-size:13px; line-height:20px;
           display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; overflow:hidden }
  .bars { margin-top:12px; display:grid; grid-template-columns:max-content 1fr 36px; gap:6px 12px; align-items:center; color:var(--muted); font-size:11.5px; white-space:nowrap }
  .bar { height:4px; border-radius:2px; background:var(--line); overflow:hidden }
  .bar i { display:block; height:100%; width:0; border-radius:2px; background:var(--c); transition:width .5s var(--ease) }
  .bars b { font-weight:500; text-align:right; color:var(--text) }
  .cap { margin-top:12px; color:var(--faint); font-size:11px; line-height:16px; letter-spacing:.02em }
  .cap + .bars { margin-top:6px }
  .note { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); color:var(--warn) }
  .note.bad { color:var(--bad) }

  /* Composer */
  #composer { position:fixed; left:0; right:0; bottom:0; padding:16px 24px 24px; background:linear-gradient(transparent, var(--bg) 40%);
              transform:translateY(100%); transition:transform .45s var(--ease) }
  #composer.on { transform:none }
  #ask { position:relative; max-width:var(--col); margin:0 auto }
  #q { width:100%; height:48px; padding:0 56px 0 16px; border-radius:12px; background:var(--surface); border:1px solid var(--line); font-size:15px; outline:none;
       transition:border-color .2s, box-shadow .2s, background .2s }
  #q::placeholder { color:var(--faint) }
  #q:hover { border-color:var(--line-strong) }
  #q:focus { border-color:color-mix(in srgb, var(--cour) 45%, transparent); box-shadow:0 0 0 4px color-mix(in srgb, var(--cour) 8%, transparent); background:var(--raised) }
  #send { position:absolute; top:8px; right:8px; width:32px; height:32px; border-radius:8px; display:grid; place-items:center;
          background:var(--line); color:var(--faint); transition:background .2s, color .2s, transform .2s var(--spring) }
  #send.ready { background:var(--cour); color:#111 }
  #send.ready:hover { transform:scale(1.06) }
  #send:active { transform:scale(.92) }

  @media (max-width:640px) { #docbar .hide-sm { display:none } h1 { font-size:26px; line-height:32px } #pop { width:calc(100vw - 32px) } }
  @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:1ms !important; animation-delay:0ms !important; transition-duration:1ms !important } }
</style>
</head>
<body>
<header>
  <div class="brand"><i></i>LawHack</div>
  <div id="docbar">
    <b id="docname"></b><span class="sep hide-sm"></span><span id="docmeta" class="num hide-sm"></span>
    <button class="ghost" id="reset">Nouvel arrêt</button>
  </div>
</header>

<main>
  <section id="upload" class="view active">
    <h1>Qui l'a dit ?</h1>
    <p class="lede">Les IA juridiques savent ce qui a été dit. LawHack vérifie qui l'a dit.</p>
    <div id="drop" tabindex="0" role="button" aria-label="Déposer un arrêt">
      <div class="icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
      <strong>Déposez un arrêt</strong>
      <span>PDF ou .txt · Légifrance ou Judilibre</span>
      <input type="file" id="file" accept="application/pdf,.pdf,text/plain,.txt" hidden>
    </div>
    <button id="demo">Essayer avec l'arrêt de démo · Civ. 3, 14 déc. 2022, n° 21-24.539
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
    <p id="uperr" role="alert"></p>
  </section>

  <section id="reading" class="view">
    <div class="status"><span class="pulse"></span><span id="stage">Lecture de l'arrêt par le Système 1</span></div>
    <div class="track wait" id="track"><i></i></div>
    <div class="doc" id="doc"></div>
    <p class="counter num" id="counter" style="margin-top:12px">Extraction, zonage, segmentation, attribution…</p>
  </section>

  <section id="chat" class="view">
    <div class="legend" id="legend"></div>
    <div id="thread"></div>
  </section>
</main>

<div id="composer">
  <form id="ask"><input id="q" placeholder="Posez une question sur l'arrêt…" autocomplete="off" aria-label="Question">
    <button id="send" aria-label="Envoyer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button></form>
</div>
<div id="pop" role="tooltip"></div>

<script>
const COLORS = {COUR_CASSATION:'--cour', JURIDICTION_FOND:'--ca', DEMANDEUR:'--dem', DEFENDEUR:'--def', LOI:'--loi', MINISTERE_PUBLIC:'--mp', INDETERMINE:'--ind'};
const NAMES = {COUR_CASSATION:'Cour de cassation', JURIDICTION_FOND:"Cour d'appel", DEMANDEUR:'Demandeur', DEFENDEUR:'Défendeur', LOI:'Loi', MINISTERE_PUBLIC:'Ministère public', INDETERMINE:'Indéterminé'};
const SOLUTIONS = {REJET:'Rejet', CASSATION:'Cassation', CASSATION_PARTIELLE:'Cassation partielle', CASSATION_PARTIELLE_SANS_RENVOI:'Cassation partielle sans renvoi',
                   CASSATION_SANS_RENVOI:'Cassation sans renvoi', RENVOI_QPC:'Renvoi QPC', NON_RENVOI_QPC:'Non-renvoi QPC', AUTRE:'Autre'};
const SUGGESTIONS = ['Quelle est la solution de la Cour ?', 'Que reprochait le demandeur au pourvoi ?', "Qu'avait retenu la cour d'appel ?"];
const color = s => `var(${COLORS[s] || '--ind'})`;
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = v => `${Math.round(v * 100)}\u202f%`;
const fr = v => Number(v).toLocaleString('fr-FR');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const $ = id => document.getElementById(id);
let doc = null, docName = '', pills = [], busy = false;

function show(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === id));
  $('composer').classList.toggle('on', id === 'chat');
  $('docbar').classList.toggle('on', id === 'chat');
  window.scrollTo(0, 0);
}

$('legend').innerHTML = Object.entries(NAMES).slice(0, 5)
  .map(([k, v]) => `<button data-speaker="${k}" style="--c:${color(k)}"><span class="dot"></span>${v}</button>`).join('');
$('legend').onmouseover = e => { const b = e.target.closest('button'); if (!b) return;
  $('thread').classList.add('focus'); document.querySelectorAll('#thread .pill').forEach(p => p.classList.toggle('match', p.dataset.speaker === b.dataset.speaker)); };
$('legend').onmouseleave = () => $('thread').classList.remove('focus');

const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('file').click(); } };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]); };
$('file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) upload(f); };
$('demo').onclick = () => start(fetch('/api/documents/demo', {method:'POST'}), 'Civ. 3, 14 déc. 2022');
$('reset').onclick = () => { doc = null; $('thread').innerHTML = ''; hidePop(); show('upload'); };

function upload(file) { const fd = new FormData(); fd.append('file', file); start(fetch('/api/documents', {method:'POST', body:fd}), file.name.replace(/\.(pdf|txt)$/i, '')); }

function fail(message) {
  show('upload'); $('uperr').textContent = message;
  drop.classList.remove('shake'); void drop.offsetWidth; drop.classList.add('shake');
}

async function start(request, name) {
  $('uperr').textContent = ''; docName = name; show('reading');
  $('track').className = 'track wait'; $('track').firstElementChild.style.width = '';
  $('stage').textContent = "Lecture de l'arrêt par le Système 1";
  $('counter').textContent = 'Extraction, zonage, segmentation, attribution…';
  $('doc').innerHTML = [92, 100, 84, 97, 70, 100, 88, 60, 95, 78].map(w => `<div class="skel" style="width:${w}%"></div>`).join('');
  let res, data;
  try { res = await request; data = await res.json(); } catch { return fail('Connexion au serveur impossible.'); }
  if (!res.ok) return fail(data.detail || 'Erreur');
  doc = data; await animate(data);
}

async function animate(data) {
  const n = data.entries.length;
  $('doc').innerHTML = data.entries.map(e => `<span class="seg" id="r-${e.id}" style="--c:${color(e.speaker)}">${e.paragraph ? '§' + e.paragraph + ' ' : ''}${esc(e.text)}</span> `).join('');
  $('track').className = 'track';
  const bar = $('track').firstElementChild, box = $('doc');
  const step = Math.max(40, Math.min(140, 3000 / n));
  for (const [i, e] of data.entries.entries()) {
    const el = $('r-' + e.id); el.classList.add('on');
    box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 2);
    bar.style.width = `${(i + 1) / n * 100}%`;
    $('counter').textContent = `${i + 1} / ${n} segments · ${fr(data.seconds)} s · ${fr(data.input_tokens)} tokens${data.model ? ' · ' + data.model : ''}`;
    await sleep(step);
  }
  $('stage').textContent = 'Registre prêt';
  await sleep(600);
  $('docname').textContent = docName;
  $('docmeta').textContent = `${SOLUTIONS[data.solution] || data.solution} · ${n} segments · ${fr(data.seconds)} s`;
  $('thread').innerHTML = `<div class="empty" id="empty"><p>Solution détectée : ${esc(SOLUTIONS[data.solution] || data.solution)}. Commencez par une question :</p>
    <div class="chips">${SUGGESTIONS.map(s => `<button class="chip">${esc(s)}</button>`).join('')}</div></div>`;
  $('thread').querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent));
  show('chat'); $('q').focus();
}

function pill(p, i) {
  const k = pills.push({kind:'source', ...p}) - 1;
  const where = p.paragraph ? '§' + p.paragraph : p.zone_label;
  const flag = p.level === 'ok' ? '' : '<span class="flag"></span>';
  return `<span class="pill ${p.level}" tabindex="0" data-k="${k}" data-speaker="${p.speaker}" style="--c:${color(p.speaker)};--i:${i}"><span class="dot"></span>${esc(p.label)} · ${esc(where)} · ${pct(p.confidence)}${flag}</span>`;
}

function render(a) {
  if (a.abstained) return `<span class="s abstain" style="--i:0">L'arrêt ne traite pas cette question.</span><span class="pill neutral" style="--i:0">Abstention</span>`;
  return a.sentences.map((s, i) => {
    const revised = s.revised_from ? `<span class="pill neutral" tabindex="0" data-k="${pills.push({kind:'revised', from:s.revised_from}) - 1}" style="--i:${i}">corrigé</span>` : '';
    const tags = s.pills.length ? s.pills.map(p => pill(p, i)).join('') : `<span class="pill unsupported neutral" tabindex="0" data-k="${pills.push({kind:'none'}) - 1}" style="--i:${i}">non sourcé<span class="flag"></span></span>`;
    const cut = s.text.trimEnd().lastIndexOf(' ') + 1;
    return `<span class="s" style="--i:${i}">${esc(s.text.slice(0, cut))}<span class="nw">${esc(s.text.slice(cut).trimEnd())}${revised}${tags}</span></span>`;
  }).join(' ') + `<div class="foot num" style="--i:${a.sentences.length}">${fr(a.seconds)} s</div>`;
}

$('q').oninput = () => $('send').classList.toggle('ready', !!$('q').value.trim());
$('ask').onsubmit = e => { e.preventDefault(); send($('q').value); };

async function send(text) {
  const q = text.trim(); if (!q || !doc || busy) return;
  busy = true; $('q').value = ''; $('send').classList.remove('ready'); $('empty')?.remove();
  $('thread').insertAdjacentHTML('beforeend', `<div class="q">${esc(q)}</div>`);
  const box = document.createElement('div'); box.className = 'a';
  box.innerHTML = '<div class="thinking"><span class="dots"><i></i><i></i><i></i></span><span class="shim">Recherche des passages et vérification…</span></div>';
  $('thread').append(box); box.scrollIntoView({behavior:'smooth', block:'end'});
  try {
    const res = await fetch(`/api/documents/${doc.document_id}/ask`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({question:q})});
    const data = await res.json();
    box.innerHTML = res.ok ? render(data) : `<span class="err">${esc(data.detail || 'Erreur')}</span>`;
  } catch { box.innerHTML = '<span class="err">Connexion au serveur impossible.</span>'; }
  busy = false; box.scrollIntoView({behavior:'smooth', block:'end'}); $('q').focus();
}

/* Popover */
const pop = $('pop'); let anchor = null;
function bars(probs) {
  return Object.entries(probs).sort((a, b) => b[1] - a[1]).slice(0, 3)
    .map(([s, v]) => `<span>${esc(NAMES[s] || s)}</span><span class="bar" style="--c:${color(s)}"><i data-w="${v * 100}"></i></span><b class="num">${pct(v)}</b>`).join('');
}
function content(p) {
  if (p.kind === 'revised') return `<div class="ph">Reformulé après vérification</div><div class="quote" style="--c:var(--muted)">${esc(p.from)}</div>`;
  if (p.kind === 'none') return `<div class="ph">Aucune source</div><div class="note bad" style="margin:0;padding:0;border:0">Aucun passage de l'arrêt ne soutient cette phrase.</div>`;
  const note = p.level === 'warn' ? `<div class="note">${esc(p.note || 'À vérifier dans le texte.')}</div>`
             : p.level === 'unsupported' ? '<div class="note bad">Non soutenu par le passage cité.</div>' : '';
  return `<div class="ph" style="--c:${color(p.speaker)}"><span class="dot"></span>${esc(p.zone_label)}${p.paragraph ? ', §' + p.paragraph : ''}<small class="num">${esc(p.segment_id)}</small></div>
    <div class="quote" style="--c:${color(p.speaker)}">${esc(p.source_text)}</div><div class="cap">Locuteur selon Jev · soutien du passage ${pct(p.confidence)}</div><div class="bars">${bars(p.probabilities)}</div>${note}`;
}
function showPop(el) {
  if (anchor === el) return; anchor = el;
  pop.innerHTML = content(pills[el.dataset.k]);
  const r = el.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const left = Math.min(Math.max(16, r.left + r.width / 2 - w / 2), innerWidth - w - 16);
  const below = r.top - h - 8 < 64;
  pop.classList.toggle('below', below);
  pop.style.left = `${Math.round(left)}px`; pop.style.top = `${Math.round(below ? r.bottom + 8 : r.top - h - 8)}px`;
  pop.style.setProperty('--ox', `${Math.round(r.left + r.width / 2 - left)}px`);
  pop.classList.remove('on'); void pop.offsetWidth; pop.classList.add('on');
  requestAnimationFrame(() => pop.querySelectorAll('.bar i').forEach(b => b.style.width = b.dataset.w + '%'));
}
function hidePop() { anchor = null; pop.classList.remove('on'); }
const target = e => e.target.closest?.('.pill[data-k]');
document.addEventListener('mouseover', e => { const p = target(e); p ? showPop(p) : anchor && !e.target.closest('#pop') && hidePop(); });
document.addEventListener('focusin', e => { const p = target(e); p ? showPop(p) : hidePop(); });
addEventListener('scroll', hidePop, {passive:true});
</script>
</body>
