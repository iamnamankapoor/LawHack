[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "legible"
version = "0.2.0"
description = "Qui parle dans cette décision ? Speaker and stance attribution for Cour de cassation decisions."
requires-python = ">=3.10"
dependencies = ["fastapi", "uvicorn", "python-multipart", "pydantic>=2"]

[project.optional-dependencies]
pdf = ["pymupdf"]
mcp = ["fastmcp>=2.12"]
dev = ["pytest", "httpx", "legible[pdf]"]

[tool.setuptools]
packages = ["legible"]

[tool.setuptools.package-data]
legible = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
